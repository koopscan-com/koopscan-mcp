name: Wrong or misleading answer
description: An assistant using Koopscan gave a wrong, outdated or misleading answer.
labels: [wrong-answer]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** post a full home address or a 6-character postcode here: issues are public. The 4-digit postcode area (for example 3024) and the city are enough. For a specific address, email contact@koopscan.com instead.
  - type: input
    id: area
    attributes:
      label: Postcode area (4 digits) and city
      placeholder: 3024 Rotterdam
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [lookup_address, crime_sources, not sure]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Assistant / client
      placeholder: ChatGPT, Claude, Claude Code, …
  - type: textarea
    id: what
    attributes:
      label: What was wrong, and what did you expect?
    validations:
      required: true
